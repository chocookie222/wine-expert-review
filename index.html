<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ワインエキスパート復習アプリ</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Wine Expert Review</p>
          <h1>ワインエキスパート復習</h1>
        </div>
        <button class="icon-button" id="resetSessionButton" type="button" aria-label="出題をリセット">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <main>
        <section class="panel active" id="quizPanel" aria-labelledby="quizTab">
          <div class="filters" aria-label="出題条件">
            <label>
              <span>出題</span>
              <select id="modeFilter">
                <option value="all">すべて</option>
                <option value="due">今日の復習</option>
                <option value="wrong">間違えた問題</option>
                <option value="unsure">自信ありで誤答</option>
                <option value="guess">勘で正解した問題</option>
                <option value="review">すべての復習問題</option>
                <option value="numeric">数字問題</option>
                <option value="similar">類似問題</option>
                <option value="mock">模擬試験</option>
              </select>
            </label>
            <label>
              <span>重要度</span>
              <select id="importanceFilter">
                <option value="all">S/A/B/C</option>
                <option value="S">Sのみ</option>
                <option value="A">Aのみ</option>
                <option value="B">Bのみ</option>
                <option value="C">Cのみ</option>
              </select>
            </label>
            <label>
              <span>分野</span>
              <select id="categoryFilter"></select>
            </label>
          </div>

          <fieldset class="question-limit" id="questionLimitControl">
            <legend>今回の問題数</legend>
            <div>
              <button type="button" data-question-limit="10">10問</button>
              <button type="button" data-question-limit="20">20問</button>
              <button type="button" data-question-limit="30">30問</button>
              <button type="button" data-question-limit="all">全件<span>上級</span></button>
            </div>
          </fieldset>

          <label class="reading-toggle" for="kanaReadingToggle">
            <span>
              <strong>カタカナ読み</strong>
              <small>欧文の地名・呼称・品種名</small>
            </span>
            <input id="kanaReadingToggle" type="checkbox" checked>
            <i aria-hidden="true"></i>
          </label>

          <div class="status-strip">
            <div>
              <strong id="questionCounter">0 / 0</strong>
              <span>現在のセット</span>
            </div>
            <div>
              <strong id="accuracyNow">-</strong>
              <span>回答済み</span>
            </div>
            <div>
              <strong id="wrongCount">0</strong>
              <span>誤答保存</span>
            </div>
            <div id="mockTimerBox" hidden>
              <strong id="mockTimer">--:--</strong>
              <span>残り時間</span>
              <button type="button" id="finishMockButton">模試を終了</button>
            </div>
          </div>

          <div class="study-menu" aria-label="学習メニュー">
            <button type="button" id="dueModeButton">
              <span>期限復習</span>
              <strong id="dueQuestionCount">0</strong>
            </button>
            <button type="button" id="numericModeButton">
              <span>数字問題</span>
              <strong id="numericQuestionCount">0</strong>
            </button>
            <button type="button" id="mockModeButton">
              <span>模擬試験</span>
              <strong>開始</strong>
            </button>
          </div>

          <section class="mock-setup" id="mockSetup" hidden aria-label="模擬試験設定">
            <label>
              <span>問題数</span>
              <select id="mockQuestionCount">
                <option value="60" selected>60問</option>
                <option value="120">120問</option>
              </select>
            </label>
            <label>
              <span>制限時間</span>
              <select id="mockMinutes">
                <option value="35" selected>35分</option>
                <option value="70">70分</option>
              </select>
            </label>
            <button class="primary" id="startMockButton" type="button">模擬試験を開始</button>
          </section>

          <article class="question-card" id="questionCard">
            <div class="question-meta">
              <span id="categoryBadge"></span>
              <span id="importanceBadge"></span>
              <label class="importance-editor">
                <span>変更</span>
                <select id="importanceEditor" aria-label="この問題の重要度を変更">
                  <option value="S">S</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                </select>
              </label>
            </div>
            <h2 id="questionText"></h2>
            <figure class="question-image" id="questionImageBox" hidden>
              <img id="questionImage" alt="">
              <figcaption id="questionImageCaption"></figcaption>
            </figure>
            <div class="choices" id="choices"></div>
            <div class="text-answer" id="textAnswerBox" hidden>
              <input id="textAnswerInput" type="text" autocomplete="off" autocapitalize="off" placeholder="カタカナで入力">
              <button class="primary" id="textSubmitButton" type="button" disabled>解答する</button>
            </div>
            <button class="primary multi-submit" id="multiSubmitButton" type="button" hidden disabled>
              解答する
            </button>
            <div class="answer-result" id="answerResult" hidden></div>
            <section class="explanation" id="explanationBox" hidden>
              <h3>解説</h3>
              <p id="explanationText"></p>
            </section>
            <section class="confidence-panel" id="confidencePanel" hidden aria-label="回答の自信度">
              <span>この問題の手応え</span>
              <div>
                <button type="button" data-confidence="confident">😎 自信あり</button>
                <button type="button" data-confidence="unsure">😐 自信あった</button>
                <button type="button" data-confidence="guess">😭 勘</button>
              </div>
            </section>
            <div class="actions">
              <button class="secondary" id="previousButton" type="button" disabled>
                <span aria-hidden="true">‹</span>
                前の問題
              </button>
              <button class="primary" id="nextButton" type="button" disabled>
                次の問題
                <span aria-hidden="true">›</span>
              </button>
              <button class="secondary similar-action" id="similarButton" type="button" hidden>
                関連問題をまとめて解く
              </button>
            </div>
          </article>

          <section class="result-card" id="resultCard" hidden>
            <p class="eyebrow">Result</p>
            <h2 id="resultTitle">結果</h2>
            <div class="result-score">
              <strong id="resultScore">-</strong>
              <span id="resultRate">正答率 -</span>
            </div>
            <p id="resultSummary"></p>
            <div class="result-actions">
              <button class="secondary" id="resultRestartButton" type="button">もう一度解く</button>
              <button class="primary" id="resultStatsButton" type="button">成績を見る</button>
            </div>
          </section>

          <section class="empty-state" id="emptyState" hidden>
            <div class="glass-mark" aria-hidden="true"></div>
            <h2>条件に合う問題がありません</h2>
            <p>出題条件を変更するか、問題データを開発者側で追加してください。</p>
          </section>
        </section>

        <section class="panel" id="statsPanel" aria-labelledby="statsTab">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Progress</p>
              <h2>分野別正答率</h2>
            </div>
            <button class="text-button" id="clearHistoryButton" type="button">履歴を消去</button>
          </div>
          <section class="study-dashboard" aria-label="学習計画">
            <div class="plan-fields">
              <label>
                <span>試験日</span>
                <input id="examDateInput" type="date">
              </label>
              <label>
                <span>1日の目標</span>
                <input id="dailyTargetInput" type="number" min="1" max="500" step="1" inputmode="numeric">
              </label>
            </div>
            <div class="plan-metrics">
              <div><strong id="daysRemaining">未設定</strong><span>試験まで</span></div>
              <div><strong id="todayProgress">0 / 20</strong><span>今日の回答</span></div>
              <div><strong id="dueReviewMetric">0</strong><span>復習期限</span></div>
            </div>
            <div class="daily-meter" aria-label="今日の学習達成率"><i id="dailyProgressBar"></i></div>
            <div class="confidence-metrics" aria-label="自信度別の問題数">
              <div><strong id="confidentStatCount">0</strong><span>😎 自信あり</span></div>
              <div><strong id="unsureStatCount">0</strong><span>😐 自信あり誤答</span></div>
              <div><strong id="guessStatCount">0</strong><span>😭 勘</span></div>
              <div><strong id="incorrectStatCount">0</strong><span>不正解</span></div>
            </div>
          </section>
          <div class="weakness-section">
            <h3>優先して復習する分野</h3>
            <div id="weaknessList"></div>
          </div>
          <div class="stats-list" id="statsList"></div>
        </section>

        <section class="panel" id="savedPanel" aria-labelledby="savedTab">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Saved</p>
              <h2>保存済み問題</h2>
            </div>
          </div>
          <div class="saved-summary">
            <button class="saved-tile" id="wrongModeButton" type="button">
              <strong id="wrongSavedCount">0</strong>
              <span>間違えた問題だけ出題</span>
            </button>
            <button class="saved-tile" id="reviewModeButton" type="button">
              <strong id="reviewSavedCount">0</strong>
              <span>すべての復習問題</span>
            </button>
            <button class="saved-tile" id="unsureModeButton" type="button">
              <strong id="unsureSavedCount">0</strong>
              <span>自信ありで誤答</span>
            </button>
            <button class="saved-tile" id="guessModeButton" type="button">
              <strong id="guessSavedCount">0</strong>
              <span>勘で正解した問題</span>
            </button>
          </div>
          <div class="saved-list" id="savedList"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="メイン">
        <button class="nav-button active" id="quizTab" type="button" data-panel="quizPanel">
          <span aria-hidden="true">◉</span>
          問題
        </button>
        <button class="nav-button" id="statsTab" type="button" data-panel="statsPanel">
          <span aria-hidden="true">▥</span>
          成績
        </button>
        <button class="nav-button" id="savedTab" type="button" data-panel="savedPanel">
          <span aria-hidden="true">☆</span>
          復習
        </button>
      </nav>
    </div>

    <script src="questions.js"></script>
    <script src="readings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
